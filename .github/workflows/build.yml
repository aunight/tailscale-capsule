name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Service, transfer history and update checks
        run: dotnet run --project tests/ServiceChecks.csproj -c Release -- --offline
      - name: Publish WinUI 3 application
        run: dotnet publish TailscaleCapsule.csproj -c Release -p:Platform=x64 --self-contained true -o artifacts/publish
      - name: Check WinUI resources
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/publish/TailscaleCapsule.pri)) { throw 'WinUI PRI is missing' }
